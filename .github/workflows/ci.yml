name: CI

# Build + unit tests + the shared conformance corpus (conformance/vectors.json, run by conformance_test.go).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # the corpus and test-data are byte-exact: no CRLF conversion on Windows
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      # -tags less: the LESS suites through cgo and the module's copy of the patched reference C (lessc/); not on Windows
      - name: Unit tests + conformance corpus
        shell: bash
        run: go test -count=1 $([ "$RUNNER_OS" = Windows ] || echo -tags less) ./...
      # the vendor attestation verifiers (AMD SEV-SNP, Intel TDX, Azure MAA, Google Confidential Space, NVIDIA GPU) and the strict
      # X.509 readers replay conformance/attestation-evidence-vectors.json, and VerifyPassport replays the passport_hardware_vectors
      # table of conformance/passport-vectors.json. Both are produced by the TypeScript reference (the pca repository's CI checks
      # they are current); a missing file or table FAILS these tests, it is never skipped. Already part of the step above: run
      # on their own so a regression in the verifiers is visible as its own step.
      - name: Attestation verifiers (vendor vectors, strict DER, fail-closed tables)
        shell: bash
        run: go test -count=1 -run 'TestAttest|TestX509|TestPassportConformance|TestStrict|TestChainRoles|TestGcp|TestAzureMaa|TestVbios|TestNodeBase64' ./...
