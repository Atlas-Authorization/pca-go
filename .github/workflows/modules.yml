name: Adapter modules

# The separate-module adapters and kits (each has its own go.mod that replaces the library with this checkout, so the core
# module's dependencies and gates are untouched). go.sum is resolved here (go mod tidy), not checked in. A module without tests
# is compiled and vetted, which is all there is to check.
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  module:
    name: ${{ matrix.mod }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mod: [adakit, adkgo, anthropic, blstkit, echo, eino, genkit, gin, langchaingo, openai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10' # not the go.mod floor 1.26.0 (memory-corruption bugs fixed in 1.26.2/1.26.9); shortcut: not 1.26.11, whose cgo check rejects wasmtime-go's bundled archive (golang/go#83126), move up once Go ships that fix
          cache: false
      - name: Flagship checkout (for the ABE secret-key corpus generator)
        if: ${{ matrix.mod == 'blstkit' }}
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh
      - uses: actions/setup-node@v4
        if: ${{ matrix.mod == 'blstkit' }}
        with:
          node-version: '22'
      - name: ABE secret-key corpus (generated by the TypeScript reference; never committed)
        if: ${{ matrix.mod == 'blstkit' }}
        shell: bash
        run: .github/scripts/gen-secret-corpus.sh "$(pwd)/blstkit/testdata" abe:abe
      - name: Build, vet and test
        working-directory: ${{ matrix.mod }}
        run: |
          go mod tidy -e
          go build ./...
          go vet ./...
          go test -count=1 ./...
