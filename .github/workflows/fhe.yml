name: FHE (BFV on Microsoft SEAL)

# sealkit: the homomorphic risk gate through cgo over Microsoft SEAL's own C export API (native/src/seal/c, the one SEAL.NET binds), in a
# separate module so the core stays cgo-free. libsealc is built here from the pinned SEAL tag. Wire compatibility with the TypeScript
# reference (node-seal 5.1.7 = SEAL 4.1.2) is shown by replaying a corpus generated here by the reference: the native evaluator must
# reproduce the reference's evaluated ciphertexts byte for byte (re-saved uncompressed).
on:
  push:
    branches: [main, 'ci/**']
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEAL_TAG: v4.1.2

jobs:
  fhe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source layout (full shared corpus from the flagship)
        shell: bash
        run: .github/scripts/fetch-flagship-corpus.sh --mono go-pca
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: node-seal reference corpus
        run: .github/scripts/fhe-seal-corpus.sh "$RUNNER_TEMP/fhe-seal.json.gz"
      - name: libsealc at the pinned SEAL tag
        working-directory: ${{ env.PCA_MONO_SDK }}/sealkit
        run: echo "SEAL_LIB=$($GITHUB_WORKSPACE/.github/scripts/build-libsealc.sh "$SEAL_TAG" "$RUNNER_TEMP/seal")" >> "$GITHUB_ENV"
      - name: BFV replay and round trip
        working-directory: ${{ env.PCA_MONO_SDK }}/sealkit
        env:
          CGO_LDFLAGS: -L${{ env.SEAL_LIB }}
          LD_LIBRARY_PATH: ${{ env.SEAL_LIB }}
          PCA_FHE_SEAL_CORPUS: ${{ runner.temp }}/fhe-seal.json.gz
        run: go test -count=1 -timeout 30m ./...
